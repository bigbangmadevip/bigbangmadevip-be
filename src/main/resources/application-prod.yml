spring:
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}

  datasource:
    url: jdbc:mysql://bigbangmadevip-mysql:3306/bigbangmadevip?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: false

# 서버의 $HOME/config/.env에 FIREBASE_SERVICE_ACCOUNT_KEY_BASE64를 채워 넣는다. AWS 설정과 달리
# 필수값으로 두지 않는다 - 값이 없으면(아직 .env에 안 채운 배포 시점 등) 앱은 정상 기동하고
# 푸시 발송만 조용히 건너뛴다.
firebase:
  service-account-key-base64: ${FIREBASE_SERVICE_ACCOUNT_KEY_BASE64:}

# 로컬 개발용 SQL 디버그 로깅(application.yml)을 운영에서는 끈다. 매 쿼리를 로그로 찍는 건
# 트래픽 늘어난 상태에서 부하로 작용할 수 있다.
logging:
  level:
    org.hibernate.SQL: warn

aws:
  region: ${AWS_REGION}
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}
  s3:
    bucket: ${AWS_S3_BUCKET}
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN}

app:
  # music/vote 관리자 서브도메인끼리 세션(로그인)을 공유하기 위한 상위 도메인. 앞에 점을 붙이면
  # Spring Session의 DefaultCookieSerializer가 유효하지 않은 도메인으로 거부한다(RFC 6265 기준
  # 점 없이 써도 서브도메인 전체에 매칭됨). 로컬/ngrok에서는 이 값이 없어야(비어있어야) 쿠키가
  # 정상적으로 내려간다 — SecurityConfig 참고.
  cookie-domain: bigbangmadevip.com
