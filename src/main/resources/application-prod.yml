spring:
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}

  datasource:
    url: jdbc:mysql://bigbangmadevip-mysql:3306/bigbangmadevip?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: false

aws:
  region: ${AWS_REGION}
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}
  s3:
    bucket: ${AWS_S3_BUCKET}
