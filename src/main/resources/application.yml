# ngrok 등 HTTPS 프록시 뒤에서 크로스 사이트 프론트(localhost:3000)와 세션을 쓰기 위한 설정
server:
  forward-headers-strategy: framework  # 프록시의 X-Forwarded-* 헤더를 신뢰 (콜백 URL을 https 도메인 기준으로 생성)

spring:
  config:
    import: optional:file:./secrets.properties

  session:
    store-type: redis
    timeout: 60d  # 활동하면 매 요청마다 Redis TTL이 갱신되는 슬라이딩 타임아웃 (절대 상한 90일은 SessionRenewalFilter가 별도 체크)

  # 로컬에서 실제 Redis에 붙여볼 땐 `docker run -d -p 6379:6379 redis` 로 띄워두면 기본값으로 붙는다.
  # Redis가 없으면 로그인(세션) 자체가 동작하지 않는다 (S3와 달리 핵심 기능 의존성).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  datasource:
    url: jdbc:h2:mem:thevip;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  # 어드민 이미지 업로드용. 용량 제한은 여기서만 걸고(S3/CloudFront 쪽은 별도 제한 없음).
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope:
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:placeholder}
            client-secret: ${KAKAO_CLIENT_SECRET:placeholder}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope:
              - profile_nickname
              - account_email
             # - profile_image
          naver:
            client-id: ${NAVER_CLIENT_ID:placeholder}
            client-secret: ${NAVER_CLIENT_SECRET:placeholder}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            scope:
              - name
              - email
              - profile_image
          # TODO: 애플 로그인은 client-secret을 개발자 계정의 private key로
          # JWT를 생성해 넣어야 함. 애플 개발자 계정 세팅 후 추가 예정.
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

logging:
  level:
    org.hibernate.SQL: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestUri}] [%X{user}] %logger{36} - %msg%n"

app:
  front-url: http://localhost:3000  # 배포 시 실제 프론트 주소로 교체

# 로컬에서 실제 S3에 붙여볼 땐 secrets.properties에 AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/AWS_S3_BUCKET을 채워 넣는다.
# placeholder 상태로는 S3Client 빈만 뜨고 실제 호출 시점에 인증 실패한다 (앱 기동 자체는 막지 않음).
aws:
  region: ${AWS_REGION:ap-northeast-2}
  access-key-id: ${AWS_ACCESS_KEY_ID:placeholder}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:placeholder}
  s3:
    bucket: ${AWS_S3_BUCKET:placeholder}
  cloudfront:
    # CloudFront 배포 도메인(dXXXXXXXXXXXXX.cloudfront.net 또는 커스텀 도메인). 업로드된 이미지 URL을
    # 이 도메인 기준으로 만든다. 버킷은 비공개로 두고 CloudFront OAC로만 읽는 구조를 전제로 한다.
    domain: ${AWS_CLOUDFRONT_DOMAIN:placeholder.cloudfront.net}
