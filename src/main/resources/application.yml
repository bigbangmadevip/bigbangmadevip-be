# ngrok 등 HTTPS 프록시 뒤에서 크로스 사이트 프론트(localhost:3000)와 세션을 쓰기 위한 설정
server:
  forward-headers-strategy: framework  # 프록시의 X-Forwarded-* 헤더를 신뢰 (콜백 URL을 https 도메인 기준으로 생성)
  servlet:
    session:
      cookie:
        same-site: none   # 크로스 사이트 fetch에도 쿠키 전송 허용
        secure: true      # SameSite=None은 HTTPS 필수 (localhost는 예외적으로 동작)

spring:
  config:
    import: optional:file:./secrets.properties

  datasource:
    url: jdbc:h2:mem:thevip;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope:
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:placeholder}
            client-secret: ${KAKAO_CLIENT_SECRET:placeholder}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope:
              - profile_nickname
             # - profile_image
          naver:
            client-id: ${NAVER_CLIENT_ID:placeholder}
            client-secret: ${NAVER_CLIENT_SECRET:placeholder}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            scope:
              - name
              - email
              - profile_image
          # TODO: 애플 로그인은 client-secret을 개발자 계정의 private key로
          # JWT를 생성해 넣어야 함. 애플 개발자 계정 세팅 후 추가 예정.
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

logging:
  level:
    org.hibernate.SQL: debug

app:
  front-url: http://localhost:3000  # 배포 시 실제 프론트 주소로 교체
